openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0
  description: APIs for managing employees and their associations
  contact:
    name: Rohit Kuna
    email: rohitkuna28@gmail.com

servers:
  - url: http://localhost:8080

tags:
  - name: Employee
  - name: Department
  - name: Project
  - name: Training

paths:
# employee resource endpoints
  /employees:
    get:
      tags:
        - Employee
      summary: Get all employees
      description: Retrieve a list of all employees
      operationId: getAllEmployees
      responses:
        '200':
          description: A list of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResult'
    post:
      tags:
        - Employee
      summary: Create a new employee
      description: Add a new employee to the system
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResult'
  /employees/{employeeId}:
    get:
      tags:
        - Employee
      summary: get employee by id
      description: Gets an employee by id
      operationId: getEmploeeById
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: fetched employee by id successfully
          content:
            appliction/json:
              schema:
                $ref: '#/components/schemas/EmployeeResult'
    patch:
      tags:
        - Employee
      summary: Update an existing employee
      description: Update the details of an existing employee
      operationId: updateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResult'
    delete:
      tags:
        - Employee
      summary: Delete an existing employee
      description: Delete an employee by id
      operationId: deleteEmployeeById
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: successfully deleted an employee
# department resource endpoints
  /departments:
    get:
      tags:
        - Department
      summary: get all departments
      description: get all existing departments
      operationId: getAllDepartments
      responses:
        200:
          description: fetched all departments successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentResult'
    post:
      tags:
        - Department
      summary: create a department
      description: create a new department
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        201:
          description: created a department successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResult'
  /departments/{departmentId}:
    get:
      tags:
        - Department
      summary: get a department by id
      description: get a department by id
      operationId: getDepartmentById
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: fetched a department by id successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResult'
    patch:
      tags:
        - Department
      summary: update a department
      description: update a department by id
      operationId: updateDepartment
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        204:
          description: updated a department by id successfully

# projects resource endpoints
  /projects:
    get:
      tags:
        - Project
      summary: get all projects
      description: get all existing projects
      operationId: getAllProjects
      responses:
        200:
          description: fetched all projects successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResult'
    post:
      tags:
        - Project
      summary: create a project
      description: create a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        201:
          description: created a project successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResult'
  /projects/{projectId}:
    get:
      tags:
        - Project
      summary: get project by id
      description: get an existing project by id
      operationId: getProjectById
      parameters:
        - name: projectId
          in : path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: fetched project by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResult'
    patch:
      tags:
        - Project
      summary: update a project by id
      description: update an existing project by id
      operationId: updateProjectById
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: updated a project by id successfully
    delete:
      tags:
        - Project
      summary: delete a project by id
      description: delete an existing project by id
      operationId: deleteProjectById
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: deleted a project by id successfully

# training resource endpoints
  /trainings:
    get:
      tags:
        - Training
      summary: get all trainings
      description: get all existing trainings
      operationId: getAllTrainings
      responses:
        200:
          description: fetched all trainings successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingResult'
    post:
      tags:
        - Training
      summary: create a new training
      description: create a new training
      operationId: createTraining
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
      responses:
        201:
          description: training created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResult'
  /trainings/{trainingId}:
    get:
      tags:
        - Training
      summary: get training by id
      description: get an existing training by id
      operationId: getTrainingById
      parameters:
        - name: trainingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: fetched training by id successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResult'
    patch:
      tags:
        - Training
      summary: update training details
      description: update training details by id
      operationId: updateTrainingById
      parameters:
        - name: trainingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
      responses:
        204:
          description: training updated successfully
  /trainings/{trainingId}/deactivate:
    patch:
      tags:
        - Training
      summary: deactivate training
      description: deactivate training by id
      operationId: deactivateTrainingById
      parameters:
        - name: trainingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: training deactivated successfully

# employee projects association
  /employees/{employeeId}/projects:
    get:
      tags:
        - Employee
      summary: get all projects assigned to an employee
      description: get all projects assigned to employee
      operationId: getAllProjectsAssignedToEmployeeId
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: successfully fetched all projects assigned to employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResult'
  /projects/{projectId}/employees:
    get:
      tags:
        - Project
      summary: get all employees under a project
      description: get all employees under a project
      operationId: getAllEmployeesUnderProjectId
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: fetched all employees under a project successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResult'
  /employees/{employeeId}/projects/{projectId}:
    post:
      tags:
        - Employee
      summary: assign a project to an employee
      description: assign a project to an employee
      operationId: assign an existing project to an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: successfully assigned project to an employee
    delete:
      tags:
        - Employee
      summary: unassign a project from an employee
      description: unassign a project from an employee
      operationId: unassign a project from an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: successfully unassigned a project from an employee

# employee trainings association
  /employees/{employeeId}/trainings:
    get:
      tags:
        - Employee
      summary: get all trainings assigned to the employee
      description: get all trainings assigned to the existing employee
      operationId: getAllTrainingsAsignedToEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: fetched all trainings assigned to employee successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeTrainingDetailsResult'
  /employees/{employeeId}/trainings/{trainingId}:
    patch:
      tags:
        - Employee
      summary: update details of a training assigned to an employee
      description: update details of a training assigned to an employee
      operationId: updateTrainingDetailsForAnEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: trainingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTrainingDetailsRequest'
      responses:
        204:
          description: updated the details of training successfully
    post:
      tags:
        - Employee
      summary: assign a training to an employee
      description: assign an existing training to an employee
      operationId: assignTrainingToEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTrainingDetailsRequest'
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: trainingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: assigned trainings to employee successfully
    delete:
      tags:
        - Employee
      summary: unassign a training for an employee
      description: unassign an existing training for an employee
      operationId: unassignTrainingForEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: trainingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: unassigned trainings to employee successfully

components:
  schemas:
    EmployeeResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: 'john.doe@example.com'
        passport:
          $ref: '#/components/schemas/PassportResult'
        department:
          $ref: '#/components/schemas/DepartmentResult'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressResult'
    AddressResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        houseNumber:
          type: integer
          example: 123
        street:
          type: string
          example: 'Main Street'
        city:
          type: string
          example: 'Springfield'
        state:
          type: string
          example: 'IL'
        country:
          type: string
          example: 'USA'
        zipCode:
          type: string
          example: '62704'
        addressType:
          $ref: '#/components/schemas/AddressType'
    AddressType:
      type: string
      enum:
        - HOME
        - OFFICE
    DepartmentResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Engineering'
    PassportResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        passportNumber:
          type: string
          example: 'A12345678'
        dateOfIssue:
          type: string
          format: date
          example: '2025-12-31'
        dateOfExpiry:
          type: string
          format: date
          example: '2035-12-31'
    EmployeeRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: 'johndoe@gmail.com'
        passport:
          $ref: '#/components/schemas/PassportRequest'
        departmentId:
          type: integer
          example: 1
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressRequest'
    AddressRequest:
      type: object
      required:
      - houseNumber
      - street
      - city
      - state
      - country
      - zipCode
      - addressType
      properties:
        houseNumber:
          type: integer
          example: 123
        street:
          type: string
          example: 'Main Street'
        city:
          type: string
          example: 'Springfield'
        state:
          type: string
          example: 'IL'
        country:
          type: string
          example: 'USA'
        zipCode:
          type: string
          example: '62704'
        addressType:
          $ref: '#/components/schemas/AddressType'
    PassportRequest:
      type: object
      required:
        - passportNumber
        - issuingCountry
        - dateOfIssue
        - dateOfExpiry
      properties:
        passportNumber:
          type: string
          example: 'A12345678'
        dateOfIssue:
          type: string
          format: date
          example: '2025-12-31'
        dateOfExpiry:
          type: string
          format: date
          example: '2035-12-31'
    DepartmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: HR
    ProjectResult:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        name:
          type: string
          example: Telekom
    ProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: DTAG
    TrainingResult:
      type: object
      properties:
        id:
          type: integer
          example: 501
        name:
          type: string
          example: Spring Boot Advanced
        domain:
          type: string
          example: Backend
        active:
          type: boolean
          example: true
    TrainingRequest:
      type: object
      required:
        - name
        - domain
      properties:
        name:
          type: string
          example: Spring Boot Advanced
        domain:
          type: string
          example: Backend
    EmployeeTrainingDetailsResult:
      type: object
      properties:
        name:
          type: string
          example: Java SpringBoot training
        domain:
          type: string
          example: Fullstack
        startDate:
          type: string
          format: date
          example: '2024-12-31'
        endDate:
          type: string
          format: date
          example: '2025-12-8'
    EmployeeTrainingDetailsRequest:
      type: object
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date
          example: '2024-12-31'
        endDate:
          type: string
          format: date
          example: '2025-12-8'




